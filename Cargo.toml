[package]
name = "cafleet"
version = "0.35.4"
edition = "2024"

[lints.rust]
unsafe_code = "deny"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std", "now"] }
clap = { version = "4", features = ["derive"] }
nix = { version = "0.31", features = ["signal", "fs", "poll", "term", "process", "user", "socket"] }
portable-pty = "0.9"
filedescriptor = "0.8"
vt100 = "0.18.1"
rustix = { version = "1", features = ["termios", "time"] }
signal-hook = "0.4"
regex = "1"
rusqlite = { version = "0.41", features = ["bundled", "hooks"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.11"

[dev-dependencies]
tempfile = "3"

[profile.dev.package."*"]
opt-level = 2

[profile.dev.package.libsqlite3-sys]
opt-level = 1

[profile.dev.package.cafleet]
debug = "line-tables-only"
