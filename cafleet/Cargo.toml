[package]
name = "cafleet"
version = "0.27.1"
edition = "2024"

[lints.rust]
unsafe_code = "forbid"

[dependencies]
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
nix = { version = "0.31", features = ["signal", "fs", "poll"] }
refinery = { version = "0.9", features = ["rusqlite"] }
regex = "1"
rusqlite = { version = "0.39", features = ["bundled"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.11"
unicode-width = "0.2"

[dev-dependencies]
rusqlite = { version = "0.39", features = ["hooks"] }
sha2 = "0.11"
tempfile = "3"
