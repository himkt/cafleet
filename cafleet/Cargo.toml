[package]
name = "cafleet"
version = "0.29.0"
edition = "2024"

[lints.rust]
unsafe_code = "forbid"

[dependencies]
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
nix = { version = "0.31", features = ["signal", "fs", "poll", "term", "process", "user", "socket"] }
portable-pty = "0.9"
filedescriptor = "0.8"
vt100 = "0.18.1"
rustix = { version = "1", features = ["termios"] }
signal-hook = "0.4"
refinery = { version = "0.10", features = ["rusqlite"] }
regex = "1"
rusqlite = { version = "0.39", features = ["bundled", "hooks"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.11"

[target.'cfg(target_os = "macos")'.dependencies]
libproc = "0.14"

[dev-dependencies]
tempfile = "3"
