name: Release

on:
  release:
    types:
      - published

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-15
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          experimental: true
      - run: mise //admin:install
      - run: mise //admin:build
      - run: rustup target add ${{ matrix.target }}
      - name: Install cargo-zigbuild
        if: contains(matrix.target, 'musl')
        run: pipx install cargo-zigbuild
      - name: Build the release binary
        if: "!contains(matrix.target, 'musl')"
        working-directory: cafleet
        run: cargo build --release --target ${{ matrix.target }}
      - name: Build the release binary (zig-linked musl cross-compile)
        if: contains(matrix.target, 'musl')
        working-directory: cafleet
        run: cargo zigbuild --release --target ${{ matrix.target }}
      - name: Package and upload the release archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tar -czf "cafleet-v${{ github.event.release.tag_name }}-${{ matrix.target }}.tar.gz" -C "cafleet/target/${{ matrix.target }}/release" cafleet
          gh release upload "${{ github.event.release.tag_name }}" "cafleet-v${{ github.event.release.tag_name }}-${{ matrix.target }}.tar.gz" --clobber
