name: Release

on:
  release:
    types:
      - published

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-15
            bottle_tag: arm64_sonoma
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
            bottle_tag: x86_64_linux
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04
            bottle_tag: arm64_linux
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          experimental: true
      - run: mise //admin:install
      - run: mise //admin:build
      - run: rustup target add ${{ matrix.target }}
      - name: Install cargo-zigbuild
        if: contains(matrix.target, 'musl')
        run: pipx install cargo-zigbuild
      - name: Build the release binary
        if: "!contains(matrix.target, 'musl')"
        working-directory: cafleet
        run: cargo build --release --target ${{ matrix.target }}
      - name: Build the release binary (zig-linked musl cross-compile)
        if: contains(matrix.target, 'musl')
        working-directory: cafleet
        run: cargo zigbuild --release --target ${{ matrix.target }}
      - name: Package and upload the release archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tar -czf "cafleet-v${{ github.event.release.tag_name }}-${{ matrix.target }}.tar.gz" -C "cafleet/target/${{ matrix.target }}/release" cafleet
          gh release upload "${{ github.event.release.tag_name }}" "cafleet-v${{ github.event.release.tag_name }}-${{ matrix.target }}.tar.gz" --clobber
      - name: Package and upload the bottle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "keg/cafleet/${{ github.event.release.tag_name }}/bin"
          cp "cafleet/target/${{ matrix.target }}/release/cafleet" "keg/cafleet/${{ github.event.release.tag_name }}/bin/cafleet"
          tar -czf "cafleet-${{ github.event.release.tag_name }}.${{ matrix.bottle_tag }}.bottle.tar.gz" -C keg cafleet
          gh release upload "${{ github.event.release.tag_name }}" "cafleet-${{ github.event.release.tag_name }}.${{ matrix.bottle_tag }}.bottle.tar.gz" --clobber
