name: Release

on:
  pull_request:
    types:
      - closed
    branches:
      - main

jobs:
  create:
    if: >-
      github.event.pull_request.merged &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'bump-')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.draft.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
      - id: draft
        name: Create the draft release with generated notes
        run: |
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')"
          gh release create "$version" --draft --target "$merge_sha" --title "$version" --generate-notes
          echo "version=$version" >> "$GITHUB_OUTPUT"
        env:
          merge_sha: ${{ github.event.pull_request.merge_commit_sha }}
          GH_TOKEN: ${{ github.token }}

  build:
    needs: create
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-15
            bottle_tag: arm64_sonoma
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
            bottle_tag: x86_64_linux
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04
            bottle_tag: arm64_linux
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
    env:
      version: ${{ needs.create.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          experimental: true
      - run: rustup target add ${{ matrix.target }}
      - name: Install cargo-zigbuild
        if: contains(matrix.target, 'musl')
        run: pipx install cargo-zigbuild
      - name: Build the release binary
        if: "!contains(matrix.target, 'musl')"
        run: cargo build --release --target ${{ matrix.target }}
      - name: Build the release binary (zig-linked musl cross-compile)
        if: contains(matrix.target, 'musl')
        run: cargo zigbuild --release --target ${{ matrix.target }}
      - name: Package and upload the release archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tar -czf "cafleet-v${version}-${{ matrix.target }}.tar.gz" -C "target/${{ matrix.target }}/release" cafleet
          gh release upload "$version" "cafleet-v${version}-${{ matrix.target }}.tar.gz" --clobber
      - name: Package and upload the bottle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "keg/cafleet/${version}/bin"
          cp "target/${{ matrix.target }}/release/cafleet" "keg/cafleet/${version}/bin/cafleet"
          tar -czf "cafleet-${version}.${{ matrix.bottle_tag }}.bottle.tar.gz" -C keg cafleet
          gh release upload "$version" "cafleet-${version}.${{ matrix.bottle_tag }}.bottle.tar.gz" --clobber

  publish:
    needs:
      - create
      - build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish the release
        run: gh release edit "$version" --draft=false
        env:
          version: ${{ needs.create.outputs.version }}
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
