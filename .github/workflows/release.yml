name: Release

on:
  release:
    types:
      - published

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-15
            bottle_tag: arm64_sonoma
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
            bottle_tag: x86_64_linux
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04
            bottle_tag: arm64_linux
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: jdx/mise-action@dad1bfd3df957f44999b559dd69dc1671cb4e9ea # v4.2.1
        with:
          experimental: true
      - run: mise //admin:install
      - run: mise //admin:build
      - run: rustup target add ${{ matrix.target }}
      - name: Install cargo-zigbuild
        if: contains(matrix.target, 'musl')
        run: pipx install cargo-zigbuild
      - name: Build the release binary
        if: "!contains(matrix.target, 'musl')"
        working-directory: cafleet
        run: cargo build --release --target ${{ matrix.target }}
      - name: Build the release binary (zig-linked musl cross-compile)
        if: contains(matrix.target, 'musl')
        working-directory: cafleet
        run: cargo zigbuild --release --target ${{ matrix.target }}
      - name: Package and upload the release archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${{ github.event.release.tag_name }}"
          archive="cafleet-v${version}-${{ matrix.target }}.tar.gz"
          tar -czf "${archive}" -C "cafleet/target/${{ matrix.target }}/release" cafleet
          gh release upload "${version}" "${archive}" --clobber
      # name and keg layout are what brew derives from the formula's root_url
      - name: Package and upload the bottle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${{ github.event.release.tag_name }}"
          bottle="cafleet-${version}.${{ matrix.bottle_tag }}.bottle.tar.gz"
          mkdir -p "keg/cafleet/${version}/bin"
          cp "cafleet/target/${{ matrix.target }}/release/cafleet" "keg/cafleet/${version}/bin/cafleet"
          tar -czf "${bottle}" -C keg cafleet
          gh release upload "${version}" "${bottle}" --clobber
          echo "${bottle} sha256: $(shasum -a 256 "${bottle}" | cut -d' ' -f1)" >> "${GITHUB_STEP_SUMMARY}"
