name: Publish

on:
  pull_request:
    types:
      - closed
    branches:
      - main

jobs:
  publish:
    if: >-
      github.event.pull_request.merged &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'bump-')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # A release created with GITHUB_TOKEN does not trigger release.yml, so the App token publishes it.
      - id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.BUMP_APP_CLIENT_ID }}
          private-key: ${{ secrets.BUMP_APP_PRIVATE_KEY }}
          permission-contents: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
      - name: Create the release with generated notes
        run: |
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')"
          gh release create "$version" --target "$merge_sha" --title "$version" --generate-notes
        env:
          merge_sha: ${{ github.event.pull_request.merge_commit_sha }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
