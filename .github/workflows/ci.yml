name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          experimental: true
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            cafleet/target
          key: ${{ runner.os }}-cargo-lint-${{ hashFiles('cafleet/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-lint-
      - run: mise //admin:install
      - run: mise //admin:build
      - run: mise //cafleet:lint
      - run: mise //cafleet:typecheck

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          experimental: true
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            cafleet/target
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('cafleet/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-test-
      - run: mise //admin:install
      - run: mise //admin:build
      - run: mise //cafleet:test
