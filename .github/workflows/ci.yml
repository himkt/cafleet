name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          experimental: true
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            cafleet/target
          key: ${{ runner.os }}-cargo-lint-${{ hashFiles('cafleet/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-lint-
      - run: mise //admin:install
      - run: mise //admin:lint
      - run: mise //cafleet:lint

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          experimental: true
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            cafleet/target
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('cafleet/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-test-
      - run: mise //admin:install
      - run: mise //admin:test
      - run: mise //cafleet:test
