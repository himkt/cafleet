monorepo_root = true

[monorepo]
config_roots = [
  "cafleet",
  "docs",
]

[tools]
"aqua:pnpm/pnpm" = "12.14.0"
"core:node" = "26.12.0"
"core:rust" = { version = "1.99.1", components = ["clippy", "rustfmt"] }
"core:zig" = "0.15.2"

[tasks.skill-install]
run = [
  "gh skill install ./ --from-local --agent claude-code --force --scope user",
  "gh skill install ./ --from-local --agent codex --force --scope user",
  "gh skill install ./ --from-local --agent opencode --force --scope user",
]
description = "Install skills"

[tasks.model-refresh-test]
description = "Test offline model-refresh parsers with synthetic fixtures"
run = "python3 -B -m unittest discover -s .claude/skills/cafleet-model-list-refresh/scripts/tests"

[tasks.all-install]
run = [
  {"task" = "//cafleet:install"},
  {"task" = "//:skill-install"},
]
