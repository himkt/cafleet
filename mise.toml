monorepo_root = true

[monorepo]
config_roots = [
  "cafleet",
  "admin",
]

[tools]
"aqua:astral-sh/uv" = "0.11.29"
"aqua:pnpm/pnpm" = "11.15.0"
"core:node" = "26.5.0"

[tasks.uv-sync]
run = "uv sync --all-groups --all-packages --frozen"
description = "Sync uv workspace dependencies (all groups, all packages, frozen lockfile)"

[tasks.pnpm-install]
run = "pnpm install --frozen-lockfile"
description = "Install pnpm dependencies (slidev, agent-browser, vue, and admin) into ./node_modules"

[tasks.skill-install]
run = [
  "gh skill install ./ --from-local --agent claude-code --force --scope user",
  "gh skill install ./ --from-local --agent codex --force --scope user",
  "gh skill install ./ --from-local --agent opencode --force --scope user",
]
description = "Install skills"

[tasks.all-install]
run = [
  {"task" = "//admin:build"},
  {"task" = "//cafleet:install"},
  {"task" = "//:skill-install"},
]

[tasks.slidev]
usage = '''
arg "<slide>" help="path to slide.md file"
'''
run = "script -qfc \"pnpm exec slidev --open false {{ arg(name='slide') }}\" /dev/null"
description = "Start the Slidev dev server inside a PTY (script -qfc) so Slidev does not detect a non-TTY stdout and exit early. The trailing /dev/null is the script(1) typescript output file — discarding it keeps the working tree clean"

[tasks."docs-build"]
description = "Build the Zensical documentation site (clean rebuild)"
run = "uv run zensical build --clean"
