experimental_monorepo_root = true

[monorepo]
config_roots = [
  "cafleet",
  "admin",
]

[tools]
"aqua:astral-sh/uv" = "latest"
"core:bun" = "latest"

[tasks.build]
run = "uv build --wheel --package cafleet"
description = "Build the cafleet wheel"

[tasks.publish]
run = [
  { "task" = "//admin:install" },
  { "task" = "//admin:build" },
  { "task" = "build" },
  "uv publish --dry-run",
]
description = "Publish cafleet"

