experimental_monorepo_root = true

[monorepo]
config_roots = [
  "cafleet",
  "admin",
]

[tools]
"aqua:astral-sh/uv" = "latest"
"core:bun" = "latest"

[tasks.uv-sync]
run = "uv sync --all-groups --all-packages --frozen"
description = "Sync uv workspace dependencies (all groups, all packages, frozen lockfile)"

[tasks.bun-install]
run = "bun install --frozen-lockfile"
description = "Install bun dependencies (slidev, agent-browser, vue) into ./node_modules"

[tasks.slidev]
usage = '''
arg "<slide>" help="path to slide.md file"
'''
run = "script -qfc \"bun run slidev --open false {{ arg(name='slide') }}\" /dev/null"
description = "Start the Slidev dev server inside a PTY (script -qfc) so Slidev does not detect a non-TTY stdout and exit early. The trailing /dev/null is the script(1) typescript output file — discarding it keeps the working tree clean"

[tasks.sync-skills]
run = [
  "rm -rf ~/.claude/skills/create-figure && cp -r skills/create-figure ~/.claude/skills/create-figure",
  "rm -rf ~/.claude/skills/my-slidev && cp -r skills/my-slidev ~/.claude/skills/my-slidev",
  "rm -rf ~/.claude/skills/research-presentation && cp -r skills/research-presentation ~/.claude/skills/research-presentation",
  "rm -rf ~/.claude/skills/research-report && cp -r skills/research-report ~/.claude/skills/research-report",
  "rm -rf ~/.claude/skills/base-dir && cp -r skills/base-dir ~/.claude/skills/base-dir",
]
description = "Mirror the five plugin-shipped skills (create-figure, my-slidev, research-presentation, research-report, base-dir) from the repo-root plugin source (skills/<name>/) to the maintainer's home-dir working copy (~/.claude/skills/<name>/). Each line removes the home-dir copy first so a re-run does not nest dirs. Canonical divergence-guard per design 0000054 (base-dir added in design 0000053)."

