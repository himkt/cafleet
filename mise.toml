monorepo_root = true

[monorepo]
config_roots = [
  "cafleet",
  "admin",
  "docs",
]

[tools]
"aqua:pnpm/pnpm" = "11.22.0"
"core:node" = "26.7.0"
"core:rust" = { version = "1.98.0", components = ["clippy", "rustfmt"] }
"core:zig" = "0.15.2"

[tasks.skill-install]
run = [
  "gh skill install ./ --from-local --agent claude-code --force --scope user",
  "gh skill install ./ --from-local --agent codex --force --scope user",
  "gh skill install ./ --from-local --agent opencode --force --scope user",
]
description = "Install skills"

[tasks.all-install]
run = [
  {"task" = "//admin:build"},
  {"task" = "//cafleet:install"},
  {"task" = "//:skill-install"},
]
