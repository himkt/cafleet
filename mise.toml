monorepo_root = true

[monorepo]
config_roots = [
  "docs",
]

[tools]
"aqua:pnpm/pnpm" = "12.22.0"
"core:node" = "26.13.1"
"core:go" = "1.27.4"
"aqua:golangci/golangci-lint" = "2.15.0"
"go:golang.org/x/vuln/cmd/govulncheck" = "1.9.0"
"core:python" = "3.15.2"
"core:rust" = { version = "1.100.0", components = ["clippy", "rustfmt"] }

[tasks.skill-install]
run = [
  "gh skill install ./ --from-local --agent claude-code --force --scope user",
  "gh skill install ./ --from-local --agent codex --force --scope user",
  "gh skill install ./ --from-local --agent opencode --force --scope user",
]
description = "Install skills"

[tasks.all-install]
run = [{ task = "//:install" }, { task = "//:skill-install" }]
description = "Install the CLI and the working-tree skills"

[tasks.test]
run = "if [ \"$(uname)\" = Linux ]; then export CGO_ENABLED=1; fi; go test -race -timeout 30m ./..."
description = "Run the tests with the race detector (arguments after one standalone -- forward to go test, e.g. -run '<regexp>')"

[tasks.test-shipped]
run = "CGO_ENABLED=0 go test -timeout 30m ./..."
description = "Run the tests in the cgo-free shipped build configuration"

[tasks.coverage]
run = "go test -cover -timeout 30m ./..."
description = "Report statement coverage of the tests"

[tasks.lint]
run = ["CGO_ENABLED=0 go vet ./...", "golangci-lint run ./...", "golangci-lint fmt --diff"]
description = "Run go vet without cgo, golangci-lint and the formatting check"

[tasks.vulncheck]
run = "govulncheck ./..."
description = "Check the module's dependencies for known vulnerabilities (needs network)"

[tasks.format]
run = "golangci-lint fmt"
description = "Format the Go sources"

[tasks.typecheck]
run = "go vet ./..."
description = "Type-check and vet the packages without producing a binary"

[tasks.install]
run = "CGO_ENABLED=0 go install ./cmd/cafleet"
description = "Install the cafleet CLI from the working tree into $GOBIN, default ~/go/bin (re-run after source edits to refresh the installed binary)"

[tasks.build]
run = "CGO_ENABLED=0 go build -trimpath -ldflags \"-s -w\" -o dist/cafleet ./cmd/cafleet"
description = "Build the release binary into dist/cafleet"
