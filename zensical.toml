[project]
site_name = "CAFleet"
site_description = "Message broker and member registry for coding agents."
site_author = "himkt"
site_url = "https://himkt.github.io/cafleet/"
copyright = "Copyright © 2026 himkt"

nav = [
    { "Get Started" = [
        "get-started/index.md",
        { "Install" = "get-started/install.md" },
        { "Configure" = "get-started/configure.md" },
        { "Quickstart" = "get-started/quickstart.md" },
        { "Contributing" = "get-started/contributing.md" },
    ] },
    { "How-to guides" = [
        "how-to/index.md",
        { "Run a mixed-backend team" = "how-to/mixed-backend-team.md" },
        { "Monitor and recover members" = "how-to/monitor-and-recover.md" },
        { "Use the admin WebUI" = "how-to/use-the-webui.md" },
        { "Design-doc-driven development" = "how-to/design-doc-development.md" },
    ] },
    { "Concepts" = [
        { "Overview" = "concepts/overview.md" },
        { "Fleet isolation" = "concepts/fleet-isolation.md" },
        { "Storage" = "concepts/storage.md" },
        { "Member lifecycle" = "concepts/member-lifecycle.md" },
        { "Coding agents" = "concepts/coding-agents.md" },
        { "Multiplexer backends" = "concepts/multiplexer-backends.md" },
        { "Monitoring" = "concepts/monitoring.md" },
    ] },
    { "Specification" = [
        { "Data model" = "spec/data-model.md" },
        { "Message envelope" = "spec/message-envelope.md" },
        { "CLI options" = "spec/cli-options.md" },
        { "Multiplexer backends" = "spec/multiplexer-backends.md" },
        { "WebUI API" = "spec/webui-api.md" },
        { "Coding-agent backends" = [
            "reference/coding-agents/index.md",
            { "Claude members" = "reference/coding-agents/claude.md" },
            { "Codex members" = "reference/coding-agents/codex.md" },
            { "Opencode members" = "reference/coding-agents/opencode.md" },
        ] },
    ] },
    { "API Reference" = [
        { "broker" = "api/broker.md" },
        { "config" = "api/config.md" },
        { "coding_agent" = "api/coding-agent.md" },
        { "multiplexer" = "api/multiplexer.md" },
    ] },
]

# Theme
[project.theme]

language = "en"

features = [
    "announce.dismiss",
    "content.code.annotate",
    "content.code.copy",
    "content.code.select",
    "content.footnote.tooltips",
    "content.tabs.link",
    "content.tooltips",
    "navigation.footer",
    "navigation.indexes",
    "navigation.instant",
    "navigation.instant.prefetch",
    "navigation.path",
    "navigation.sections",
    "navigation.top",
    "navigation.tracking",
    "search.highlight",
]

# Color palette
[[project.theme.palette]]
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

# Markdown extensions
[project.markdown_extensions.abbr]
[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.def_list]
[project.markdown_extensions.footnotes]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.toc]
permalink = true
[project.markdown_extensions.pymdownx.arithmatex]
generic = true
[project.markdown_extensions.pymdownx.betterem]
[project.markdown_extensions.pymdownx.caret]
[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.emoji]
emoji_generator = "zensical.extensions.emoji.to_svg"
emoji_index = "zensical.extensions.emoji.twemoji"
[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true
[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.keys]
[project.markdown_extensions.pymdownx.magiclink]
[project.markdown_extensions.pymdownx.mark]
[project.markdown_extensions.pymdownx.smartsymbols]
[project.markdown_extensions.pymdownx.superfences]
custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" }
]
[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true
combine_header_slug = true
[project.markdown_extensions.pymdownx.tasklist]
custom_checkbox = true
[project.markdown_extensions.pymdownx.tilde]

# mkdocstrings — resolves "::: <module>" directives against cafleet/src.
[project.plugins.mkdocstrings]
default_handler = "python"

[project.plugins.mkdocstrings.handlers.python]
paths = ["cafleet/src"]

[project.plugins.mkdocstrings.handlers.python.options]
docstring_style = "google"
show_source = true
show_root_heading = true
show_root_full_path = false
members_order = "source"
separate_signature = true
show_signature_annotations = true
filters = ["!^_"]
